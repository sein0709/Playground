{% extends "base.html" %}
{% block title %}Courses{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Courses</h1>
    <a href="{% url 'course_create' %}" class="btn btn-primary">Create Course</a>
</div>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Students</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
    {% for course in courses %}
        <tr>
            <td>{{ course.code }}</td>
            <td>{{ course.name }}</td>
            <td>{{ course.students.count }}</td>
            <td><a class="btn btn-sm btn-outline-secondary" href="{% url 'course_detail' course.pk %}">View</a></td>
        </tr>
    {% empty %}
        <tr><td colspan="4" class="text-center">No courses yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
