{% extends "base.html" %}
{% block title %}Submit Assignment{% endblock %}
{% block content %}
<h1 class="mb-3">{{ assignment.title }}</h1>
<p class="text-muted">Due {{ assignment.due_date }}</p>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
        </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Submit</button>
</form>
{% endblock %}
