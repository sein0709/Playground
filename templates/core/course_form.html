{% extends "base.html" %}
{% block title %}Course{% endblock %}
{% block content %}
<h1 class="mb-3">Course</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
        <label class="form-label" for="id_name">Name</label>
        {{ form.name }}
    </div>
    <div class="mb-3">
        <label class="form-label" for="id_code">Code</label>
        {{ form.code }}
    </div>
    <div class="mb-3">
        <label class="form-label" for="id_description">Description</label>
        {{ form.description }}
    </div>
    <div class="mb-3">
        <label class="form-label" for="id_students">Students</label>
        {{ form.students }}
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
</form>
{% endblock %}
